services:
  traefik:
    image: "traefik:v2.11"
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.postgres.address=:5433"
      # =========================================================================
      # ETAPA 1 (Red Local por IP): Se mantienen comentadas estas líneas
      # porque Let's Encrypt no emite certificados para IPs privadas (10.0.64.46).
      #
      # ETAPA 2 (Con Dominio de DNI en Puerto 443): Descomente estas líneas:
      # - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      # - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      # - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
      # =========================================================================
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard Traefik en red interna
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik

volumes:
  traefik_data:

networks:
  traefik:
    external: true

