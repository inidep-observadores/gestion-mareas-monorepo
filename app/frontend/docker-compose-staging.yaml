services:
  frontend-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigma-frontend-staging
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sigma-frontend-staging.rule=Host(`${STAGING_FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.sigma-frontend-staging.entrypoints=websecure"
      - "traefik.http.routers.sigma-frontend-staging.tls=true"
      - "traefik.http.routers.sigma-frontend-staging.tls.certresolver=mytlschallenge"
      - "traefik.http.services.sigma-frontend-staging.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
      # Redirección opcional (Traefik suele tenerla global, pero se añade por consistencia con su OpenProject)
      - "traefik.http.routers.sigma-frontend-staging-http.rule=Host(`${STAGING_FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.sigma-frontend-staging-http.entrypoints=web"
      - "traefik.http.routers.sigma-frontend-staging-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

networks:
  traefik:
    external: true
