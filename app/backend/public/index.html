<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/icon-dark.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/icon-light.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#465FFF" />
  <link rel="apple-touch-icon" href="/icon-dark.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Mareas - INIDEP</title>
  <style>
    /* Estilo crítico para evitar el flash blanco inicial */
    html,
    body {
      background-color: #020617;
      /* Fondo oscuro por defecto para Sigma */
      margin: 0;
      padding: 0;
    }
  </style>
  <script>
    // Detección ultra-temprana del tema para evitar FOUC
    (function () {
      try {
        // Buscamos en todas las posibles llaves de usuario (o guest)
        const keys = Object.keys(localStorage);
        const themeKey = keys.find(k => k.endsWith(':theme'));
        const isDark = themeKey ? localStorage.getItem(themeKey) === 'dark' : true; // Por defecto oscuro para Sigma

        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#020617';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#f8fafc';
        }
      } catch (e) { }
    })();
  </script>

</head>
