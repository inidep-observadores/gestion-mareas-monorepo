services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    container_name: mareasdb
    volumes:
      - ./postgres:/var/lib/postgresql/data
  mailhog:
    image: mailhog/mailhog
    restart: always
    ports:
      - "1025:1025" # puerto SMTP
      - "8025:8025" # interfaz web
    container_name: mailhog

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    container_name: sigma-redis
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    container_name: sigma-gotenberg-dev
    ports:
      - "3003:3000"
