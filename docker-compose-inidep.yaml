# Docker Compose Unificado para Despliegue en INIDEP
# Basado en un solo dominio con enrutamiento por Path (/api)

services:
  db-inidep:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: sigma-db-inidep
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
    volumes:
      - sigma_db_data_inidep:/var/lib/postgresql/data
    networks:
      - sigma-network

  redis-inidep:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: sigma-redis-inidep
    volumes:
      - sigma_redis_data_inidep:/data
    networks:
      - sigma-network

  backend-inidep:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: sigma-backend-inidep
    restart: unless-stopped
    depends_on:
      - db-inidep
      - redis-inidep
    environment:
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@db-inidep:5432/${DB_NAME}"
      REDIS_HOST: redis-inidep
      FRONTEND_URL: "https://${DOMAIN_NAME}" # Mismo dominio que el frontend
      # Otros valores se tomarán del archivo .env.inidep pasado al ejecutar
    volumes:
      - ./app/backend/backups:/app/backups
      - ./app/backend/static:/app/static
      - ./app/backend/uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sigma-backend.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sigma-backend.entrypoints=websecure"
      - "traefik.http.routers.sigma-backend.tls=true"
      - "traefik.http.routers.sigma-backend.priority=100" # Mayor prioridad para interceptar /api
      - "traefik.http.services.sigma-backend.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"
    networks:
      - sigma-network
      - traefik

  frontend-inidep:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: sigma-frontend-inidep
    restart: unless-stopped
    depends_on:
      - backend-inidep
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sigma-frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.sigma-frontend.entrypoints=websecure"
      - "traefik.http.routers.sigma-frontend.tls=true"
      - "traefik.http.routers.sigma-frontend.priority=10" # Menor prioridad para el resto
      - "traefik.http.services.sigma-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
    networks:
      - sigma-network
      - traefik

networks:
  sigma-network:
    driver: bridge
  traefik:
    external: true

volumes:
  sigma_db_data_inidep:
  sigma_redis_data_inidep:
